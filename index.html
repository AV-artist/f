<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two-way File Share</title>
<style>
:root{--bg:#070c1f;--bg2:#0f1840;--pn:rgba(16,24,58,.75);--pn2:rgba(30,44,100,.5);--ln:#2a3b82;--ink:#eaf0ff;--mut:#9aa8d6;--ac:#3b82ff;--ok:#2fd27e;--bad:#ff4d5e;--warn:#f5b73b;--glow:0 0 16px rgba(59,130,255,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#e4eafb;--bg2:#f5f8ff;--pn:rgba(255,255,255,.88);--pn2:#eaf0ff;--ln:#c2cdef;--ink:#101a3d;--mut:#55628f;--glow:0 0 12px rgba(59,130,255,.25)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 15% -10%,rgba(59,90,255,.28),transparent),var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
.win{width:min(1180px,100%);min-height:660px;border:1px solid var(--ln);border-radius:14px;background:linear-gradient(160deg,var(--bg2),var(--bg));box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6a4dff,#2f8bff);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.tb b{font-size:16px;display:block;line-height:1.1}.sub{color:var(--mut);font-size:11px}.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln);background:var(--pn);border-radius:8px;padding:5px 10px;font-size:11px}

.body{display:grid;grid-template-columns:150px 1fr;flex:1;min-height:0}.win.min .body{display:none}
nav{padding:10px;display:grid;gap:4px;align-content:start;border-right:1px solid var(--ln)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:0;background:none;text-align:left}
.ni:hover{background:var(--pn2)}.ni.on{background:linear-gradient(90deg,#2f6bff,#3a45e6);color:#fff;box-shadow:var(--glow)}
main{padding:12px 14px;overflow:auto;min-width:0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.h2{font-size:15px;font-weight:650}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:7px 12px;border:1px solid #3a5ac0;background:rgba(59,130,255,.14);border-radius:8px}
.btn:hover{background:rgba(59,130,255,.3)}.btn.pp{border-color:#7b4dff;background:rgba(123,77,255,.16)}
.btn.pri{background:linear-gradient(90deg,#3b6bff,#6a4dff);border:0;color:#fff;font-weight:600;font-size:14px;padding:11px;box-shadow:var(--glow)}
.btn:disabled{opacity:.6}
.tg{width:34px;height:18px;border-radius:10px;border:0;background:#4a5280;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ac)}.tg.on::after{left:18px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;padding:24px;background:linear-gradient(110deg,#141c5a,#35208a);color:#fff;min-height:200px;overflow:hidden}
.hero h1{font-size:27px;line-height:1.2;margin:0 0 12px}.hero p{margin:0;max-width:44ch;color:#d5dcff}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.ac{position:relative;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:16px;min-height:130px;text-align:left;color:#fff;display:grid;align-content:space-between;gap:12px}
.a1{background:linear-gradient(135deg,#2563ff,#3a3fd9)}.a2{background:linear-gradient(135deg,#0f9d6e,#1a5fd0)}.a3{background:linear-gradient(135deg,#7a3df0,#4b2fd0)}
.ac:hover{filter:brightness(1.12)}.ac b{font-size:16px}.ac .sub{color:#dfe6ff;font-size:12px}
.tile{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.go{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:grid;place-items:center}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}

.dc:hover,.dc.cn{border-color:var(--ac);box-shadow:var(--glow)}
.dc .top{display:flex;gap:10px;align-items:flex-start}.dc .top>div{flex:1;min-width:0}
.os{width:36px;height:36px;display:grid;place-items:center;font-size:26px}.os svg{width:30px;height:30px}.apl{filter:grayscale(1) brightness(2.2)}
.mb{border:0;background:none;color:var(--mut);padding:2px 6px}
.st{justify-self:start;border-radius:6px;padding:2px 9px 2px 7px;font-size:11px;display:inline-flex;gap:6px;align-items:center;border:1px solid}
.st.on{color:var(--ok);background:rgba(47,210,126,.12)}.st.idle{color:var(--warn);background:rgba(245,183,59,.12)}.st.off{color:var(--bad);background:rgba(255,77,94,.12)}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.auto{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:var(--pn2)}
.ib2{width:40px;height:40px;border-radius:50%;border:1px solid var(--ac);display:grid;place-items:center;color:#8ab4ff;background:rgba(59,130,255,.12);flex:none}
.sg{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:12px}
.tabs{display:flex;border:1px solid var(--ln);border-radius:8px;margin-top:12px;overflow:auto}
.tabs button{flex:1;border:0;border-right:1px solid var(--ln);background:none;padding:8px 6px;display:flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;font-size:12px;color:var(--mut)}
.tabs button.on{background:rgba(59,130,255,.22);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ac)}
.dz{border:1.5px dashed var(--ac);border-radius:10px;min-height:190px;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:14px;background:rgba(59,130,255,.05)}
.dz.over{background:rgba(59,130,255,.2)}.dz a{color:#c46bff;cursor:pointer}
textarea.t,input.t{width:100%;background:rgba(0,0,0,.18);border:1px solid var(--ln);border-radius:8px;padding:9px}textarea.t{min-height:130px;resize:vertical}
.opt{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.opt .ib2{width:34px;height:34px;border-radius:9px}
.fl{display:grid;gap:6px;margin-top:8px;max-height:300px;overflow:auto}
.fr{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:6px 8px}
.fr>div{flex:1;min-width:0}.fr b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.x{border:1px solid var(--ln);background:none;border-radius:6px;width:22px;height:22px;color:var(--mut);line-height:1}
.rg{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:12px}

.cg{display:grid;grid-template-columns:240px 1fr;gap:12px;height:560px}
.cl{display:grid;gap:6px;align-content:start;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;border:0;background:none;border-radius:8px;padding:8px;text-align:left}.ci.on{background:rgba(59,130,255,.25)}

.cp{display:flex;flex-direction:column;min-height:0;padding:0}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
#cm{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.bb{max-width:70%;padding:8px 12px;border-radius:10px;background:var(--pn2);align-self:flex-start;word-break:break-word}.bb.me{background:#2f6bff;color:#fff;align-self:flex-end}
.tm{font-size:10px;color:var(--mut);margin-bottom:6px}.tm.me{align-self:flex-end}
.fc{border:1px solid var(--ok);background:rgba(47,210,126,.1);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;align-self:flex-end;min-width:240px}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln);align-items:center;position:relative}.cin input{flex:1;background:rgba(0,0,0,.18);border:1px solid var(--ln);border-radius:8px;padding:9px}

.hg{display:grid;grid-template-columns:1fr 340px;gap:12px}
.fb{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}.fb button{border:1px solid var(--ln);background:none;border-radius:5px;padding:3px 9px;font-size:11px}.fb button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.hr>div:nth-child(2){flex:1;min-width:0}.hr .sub:last-of-type{white-space:nowrap}
.tl{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;margin-top:8px;background:var(--pn2);text-align:left;width:100%}
.tl b{display:block}.tl .sub{font-size:11px}
#pop{position:fixed;display:none;z-index:50;background:var(--bg2);border:1px solid var(--ln);border-radius:9px;padding:4px;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px}#pop button:hover{background:var(--pn2)}
#mod{position:fixed;inset:0;background:rgba(0,0,10,.6);display:none;place-items:center;z-index:60;padding:14px}#mod.show{display:grid}
.md{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:16px;width:min(460px,100%);display:grid;gap:12px}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:6px;z-index:70}
.ts{background:var(--bg2);border:1px solid var(--ac);border-radius:9px;padding:9px 14px;box-shadow:var(--glow)}.ts.bad{border-color:var(--bad)}
@media(max-width:860px){.body{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--ln)}.ni{white-space:nowrap}
.hero,.acts,.dg,.sg,.rg,.hg,.opts{grid-template-columns:1fr}.cg{grid-template-columns:1fr;height:auto}.cp{height:480px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

/* ---------- Real cross-device signaling + WebRTC data channel ---------- */
function deviceName(){return uname||'Device'}
function upsertPeer(id,n,os='pc'){
 let d=dv(id);
 if(!d){d={id,n:n||'Connected device',m:'Connected over local Wi-Fi',ip:'Peer-to-peer',s:'idle',os,peer:1};devs.push(d)}
 d.n=n||d.n||'Connected device';d.s=channels.get(id)?.readyState==='open'?'on':'idle';
 if(!ch[id])ch[id]=[];if(!chat)chat=id;
 return d;
}
function sendSignal(to,data){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({t:'signal',to,from:me,data}));}
function joinRoom(room){
 if(!/^\d{6}$/.test(String(room)))return toast('Connection code must be 6 digits','bad');
 activeRoom=String(room);signalRole='guest';try{const u=new URL(location.href);u.searchParams.set('join',activeRoom);history.replaceState(null,'',u.toString())}catch(e){}
 for(const pc of rtcPeers.values()){try{pc.close()}catch(e){}}rtcPeers.clear();channels.clear();pendingIce.clear();incomingFiles.clear();devs=devs.filter(d=>d.here);conn=null;cur=null;chat=null;
 startSignaling('guest',activeRoom);render();paintQR();
}
function startSignaling(role,room){
 if(location.protocol==='file:'){toast('Start this app with Start-File-Share.bat on the PC first.','bad');return}
 if(!('RTCPeerConnection' in window)){setConnStatus('This browser does not support WebRTC data channels. Use a current Chrome, Edge, Firefox or Safari browser.','bad');return}
 signalRole=role||signalRole;activeRoom=String(room||activeRoom);const generation=++wsGeneration;
 if(wsRetry){clearTimeout(wsRetry);wsRetry=null}
 if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
 const proto=location.protocol==='https:'?'wss:':'ws:';
 const socket=new WebSocket(proto+'//'+location.host+'/ws');ws=socket;
 socket.onopen=()=>{if(generation!==wsGeneration)return;socket.send(JSON.stringify({t:'join',room:activeRoom,id:me,name:deviceName(),role:signalRole}));setConnStatus('Signaling server connected. Waiting for another device…')};
 socket.onmessage=async ev=>{if(generation!==wsGeneration)return;let m;try{m=JSON.parse(ev.data)}catch(e){return}await onSignalMessage(m)};
 socket.onerror=()=>{if(generation===wsGeneration)setConnStatus('Cannot reach local sharing server. Start the server on the PC.','bad')};
 socket.onclose=()=>{if(generation!==wsGeneration)return;setConnStatus('Reconnecting to sharing server…','bad');wsRetry=setTimeout(()=>startSignaling(signalRole,activeRoom),2500)};
}
function setConnStatus(text,bad=false){const el=$('#qrstatus');if(el&&page==='recv')el.textContent=text;}
async function onSignalMessage(m){
 if(m.t==='welcome'){
  for(const p of (m.peers||[])){upsertPeer(p.id,p.name);if(signalRole==='host'&&p.role==='guest')createOffer(p.id).catch(()=>toast('Could not start WebRTC connection','bad'))}
  render();return;
 }
 if(m.t==='peer-joined'){
  upsertPeer(m.peer.id,m.peer.name);toast((m.peer.name||'Device')+' joined this room');
  if(signalRole==='host'&&m.peer.role==='guest')createOffer(m.peer.id).catch(e=>toast('WebRTC offer failed: '+e.message,'bad'));
  render();return;
 }
 if(m.t==='peer-left'){
  const d=dv(m.id);if(d){devs=devs.filter(x=>x.id!==m.id);saveDevs()}
  const pc=rtcPeers.get(m.id);if(pc){try{pc.close()}catch(e){}}rtcPeers.delete(m.id);channels.delete(m.id);pendingIce.delete(m.id);incomingFiles.delete(m.id);
  if(conn===m.id)conn=null;if(cur===m.id)cur=null;if(chat===m.id)chat=null;render();toast('A device disconnected');return;
 }
 if(m.t==='signal')await receiveRtcSignal(m.from,m.data||{});
}
function getPeer(peerId){let pc=rtcPeers.get(peerId);if(pc)return pc;
 pc=new RTCPeerConnection({iceServers:[]});rtcPeers.set(peerId,pc);pendingIce.set(peerId,[]);
 pc.onicecandidate=e=>{if(e.candidate)sendSignal(peerId,{candidate:e.candidate})};
 pc.ondatachannel=e=>setupDataChannel(peerId,e.channel);
 pc.onconnectionstatechange=()=>{
  const d=dv(peerId);if(d){d.s=pc.connectionState==='connected'?'on':pc.connectionState==='failed'?'off':'idle'}
  if(pc.connectionState==='failed')toast('Direct connection failed. Check both devices are on the same Wi-Fi and allow the PC firewall.','bad');
  if(pc.connectionState==='connected'&&page==='dev')render();
 };
 pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed')toast('Network path failed. Try the same Wi-Fi network on both devices.','bad')};
 return pc;
}
function setupDataChannel(peerId,dc){
 channels.set(peerId,dc);dc.binaryType='arraybuffer';dc.bufferedAmountLowThreshold=512*1024;
 const d=upsertPeer(peerId,(dv(peerId)||{}).n||'Connected device');
 dc.onopen=()=>{d.s='on';conn=peerId;cur=peerId;chat=peerId;toast('Connected securely to '+d.n);render()};
 dc.onclose=()=>{d.s='idle';if(conn===peerId)conn=null;render()};
 dc.onerror=()=>toast('Data channel error. Reconnect the device.','bad');
 dc.onmessage=e=>handleDataMessage(peerId,e.data);
}
async function createOffer(peerId){const pc=getPeer(peerId);if(!channels.has(peerId)&&signalRole==='host')setupDataChannel(peerId,pc.createDataChannel('tws-data',{ordered:true}));const offer=await pc.createOffer();await pc.setLocalDescription(offer);sendSignal(peerId,{sdp:pc.localDescription});}
async function receiveRtcSignal(peerId,data){
 const pc=getPeer(peerId);
 if(data.sdp){await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));const queued=pendingIce.get(peerId)||[];for(const c of queued){try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}pendingIce.set(peerId,[]);
  if(data.sdp.type==='offer'){const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sendSignal(peerId,{sdp:pc.localDescription})}
 }
 if(data.candidate){if(pc.remoteDescription&&pc.remoteDescription.type){try{await pc.addIceCandidate(new RTCIceCandidate(data.candidate))}catch(e){}}else pendingIce.get(peerId).push(data.candidate)}
}
async function waitForChannel(dc){while(dc.readyState==='open'&&dc.bufferedAmount>2*1024*1024)await new Promise(r=>setTimeout(r,25));if(dc.readyState!=='open')throw new Error('Device disconnected during transfer')}
function handleDataMessage(peerId,data){
 if(typeof data==='string'){
  let m;try{m=JSON.parse(data)}catch(e){return}
  if(m.t==='chat'){(ch[peerId]=ch[peerId]||[]).push({m:0,x:String(m.text||''),t:tnow()});if(page==='msg'&&chat===peerId)paintChat();else toast('Message received from '+(dv(peerId)||{n:'device'}).n);return}
  if(m.t==='file-start'){incomingFiles.set(peerId,{name:m.name,size:m.size,type:m.type||'application/octet-stream',chunks:[],received:0});toast('Receiving '+m.name+'…');return}
  if(m.t==='file-end'){
   const it=incomingFiles.get(peerId);if(!it)return;incomingFiles.delete(peerId);
   const b=new Blob(it.chunks,{type:it.type});b.arrayBuffer().then(buf=>got({from:peerId,fromName:(dv(peerId)||{n:'Device'}).n,name:it.name,size:buf.byteLength,type:it.type,buf})).catch(()=>toast('Could not assemble received file','bad'));return;
  }
  return;
 }
 const f=incomingFiles.get(peerId);if(!f)return;
 try{const u=new Uint8Array(data);if(u.length&&u[0]===1){const chunk=u.slice(1);f.chunks.push(chunk);f.received+=chunk.length}}catch(e){}
}
async function stream_(buf,T){return new Response(new Blob([buf]).stream().pipeThrough(new T('gzip'))).arrayBuffer()}
const kd=async(p,s)=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:1e5,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',0,['deriveKey']),{name:'AES-GCM',length:256},0,['encrypt','decrypt']);
async function enc(b,p){const s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12));return new Blob([s,i,await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await kd(p,s),b)]).arrayBuffer()}
async function dec(b,p){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b.slice(16,28))},await kd(p,new Uint8Array(b.slice(0,16))),b.slice(28))}
async function fin(it,buf){let n=it.name;if(n.endsWith('.gz')){buf=await stream_(buf,DecompressionStream);n=n.slice(0,-3)}it.name=n;it.size=buf.byteLength;it.blob=new Blob([buf]);it.url=URL.createObjectURL(it.blob)}
async function got(m){const who=(dv(m.from)||{n:m.fromName}).n;const it={name:m.name,size:m.size,dir:'Received',who,d:dnow(),k:kind(m.name),pending:!opts.acc};if(m.name.endsWith('.enc')){it.raw=m.buf;it.name=m.name.slice(0,-4);it.locked=1}else await fin(it,m.buf);hist.unshift(it);if(opts.acc&&!it.locked)await save(it);if(opts.note)toast('Received '+it.name+' from '+who);if(opts.open)toast('Browsers can’t open folders; file saved to your downloads');if(page==='hist')paintHist()}
async function save(it){try{if(dirH){let d=dirH;if(opts.org)d=await d.getDirectoryHandle(it.who.replace(/[^\w ]/g,'')||'device',{create:true});const w=await(await d.getFileHandle(it.name,{create:true})).createWritable();await w.write(it.blob);await w.close()}else{const a=document.createElement('a');a.href=it.url;a.download=it.name;document.body.append(a);a.click();a.remove()}it.pending=0}catch(e){toast('Could not save '+it.name,'bad')}}
/* ---------- Send real files over the selected WebRTC peer ---------- */
async function send(){
 const peerId=cur||conn, t=dv(peerId), dc=channels.get(peerId);
 if(!files.length)return toast('Choose files first','bad');
 if(!t||!dc||dc.readyState!=='open')return toast('Scan the QR with the other device and wait for Connected before sending.','bad');
 if(encr&&!pw)return toast('Set a password first','bad');if(busy)return;busy=1;
 const btn=$('#sn');let sentN=0;
 try{
  for(const f of files){
   if(!f.file)throw new Error('This item is not a real file. Clear the list and choose files from your device.');
   let buf=await f.file.arrayBuffer(),nm=f.n;
   if(zip){buf=await stream_(buf,CompressionStream);nm+='.gz'}
   if(encr){buf=await enc(buf,pw);nm+='.enc'}
   dc.send(JSON.stringify({t:'file-start',name:nm,size:buf.byteLength,type:f.file.type||'application/octet-stream'}));
   const bytes=new Uint8Array(buf),chunkSize=48*1024;
   for(let off=0;off<bytes.length;off+=chunkSize){await waitForChannel(dc);const part=bytes.subarray(off,Math.min(off+chunkSize,bytes.length));const packet=new Uint8Array(part.length+1);packet[0]=1;packet.set(part,1);dc.send(packet.buffer);if(btn)btn.textContent='Sending… '+Math.round(Math.min(1,(off+part.length)/Math.max(1,bytes.length))*100)+'%'}
   await waitForChannel(dc);dc.send(JSON.stringify({t:'file-end'}));
   hist.unshift({name:f.n,size:f.size,dir:'Sent',who:t.n,d:dnow(),k:kind(f.n)});sentN++;
  }
  toast(`Sent ${sentN} item${sentN>1?'s':''} to ${t.n}`);files=[];render();
 }catch(e){toast('Transfer failed: '+(e.message||'connection lost'),'bad')}
 finally{busy=0;if(btn)btn.textContent='Send Now'}
}

function getJoinUrl(){

}
function paintQR(){
 const c=$('#qr');if(!c)return;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
 const status=$('#qrstatus'),url=getJoinUrl();const link=$('#qrurl');
 if(!url){if(status)status.textContent='This HTML was opened as a local file. Close it and run Start-File-Share.bat on the PC; a file:// QR cannot open on your phone.';if(link)link.textContent='';return}
 if(link){link.innerHTML='Phone link: <a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a>'}
 if(status&&!serverInfo)status.textContent='Finding this PC on your Wi-Fi…';
 fetch('/api/qr.svg?data='+encodeURIComponent(url)).then(r=>{if(!r.ok)throw new Error('QR service unavailable');return r.blob()}).then(blob=>{const im=new Image();im.onload=()=>{g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);if(status)status.textContent='Ready. Scan with the phone camera; the page opens and connects automatically.'};im.onerror=()=>{if(status)status.textContent='QR image could not be rendered. Open the Phone link above manually.'};im.src=URL.createObjectURL(blob)}).catch(()=>{if(status)status.textContent='QR generator unavailable. Open the Phone link above manually.'});
}
